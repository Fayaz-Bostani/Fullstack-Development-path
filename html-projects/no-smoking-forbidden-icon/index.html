<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>No Smoking Icon</title>
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#111;">

<svg width="300" height="300" viewBox="0 0 200 200">

  <!-- Outer red circle -->
  <circle cx="100" cy="100" r="85"
    stroke="#ff0000"
    stroke-width="12"
    fill="none"/>

  <!-- Diagonal red line -->
  <line x1="55" y1="155" x2="155" y2="55"
    stroke="#ff0000"
    stroke-width="12"
    stroke-linecap="round"/>

  <!-- Cigarette body -->
  <rect x="70" y="95" width="70" height="14"
    fill="#222"/>

  <!-- Filter part -->
  <rect x="130" y="95" width="15" height="14"
    fill="#444"/>

  <!-- Smoke -->
  <path d="M60 80 C55 70, 65 65, 60 55"
    stroke="#aaa"
    stroke-width="3"
    fill="none"/>

  <path d="M75 80 C70 70, 80 65, 75 55"
    stroke="#aaa"
    stroke-width="3"
    fill="none"/>

</svg>

</body>
</html>
