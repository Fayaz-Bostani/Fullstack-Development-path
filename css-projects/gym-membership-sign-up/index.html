<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>gym-membership-sign-up</title>
        <meta name = "viewport" content="width = device-width, initial-scale = 1.0">
        <link rel = "stylesheet" href = "style.css">
    </head>

    <body>
        <h1>Gym Membership Sign-Up</h1>
        <p class = "font-p">Start your fitness journey today. Fill out the form below to join our gym.</p>
        <form method="post" action = "#">
            <fieldset>
                <label for = "first-name">Enter Your First Name: <input type="text" id = "first-name" name = "name" required></label>
                <label for = "last-name">Enter Your Last Name: <input type="text" id = "last-name" name = "l-name" required></label>
                <label for = "email">Enter Your Email: <input type = "email" required id = "email" name = "email"></label>
                <label for = "password">Enter Your Password: <input type="password" required id = "password" name = "password" 
                pattern = "[A-Za-z0-9]{8,40}"> </label>
            </fieldset>

            <fieldset>
                <legend>Membership Type (required)</legend>
                <label for = "monthly-type"><input type="radio" id = "monthly-type" name = "type" value = "monthly" class = "inline"> Monthly</label>
                <label for = "quarterly-type"><input type="radio" id = "quarterly-type" name = "type" value = "quarterly" checked  class = "inline"> Quarterly</label>
                <label for = "annual-type"><input type="radio" id = "annual-type" name = "type" value = "annual" class = "inline"> Annual</label>
            </fieldset>

            <fieldset>
                <label for = "profile-pic">Upload a profile picture: <input type="file" id = "profile-pic" name = "img"></label>
                <label for = "age">Input your age (years): <input type="number" min = "13" max="100" id = "age" name = "Age"></label>
                <label for = "refeerer">What is your main fitness goal?
                    <select id = "refeerer" name = "goal">
                        <option value = "">select one</option>
                        <option value = "1">Weight Loss</option>
                        <option value = "2">General Fitness</option>
                        <option value = "3">Muscle Gain</option>
                        <option value = "4">Athletic Performance</option>
                        </select></label>
                <label for = "health">Any health conditions should we know about? <textarea cols = "40" rows = "4" name = "condition"
                        id = "health" placeholder="E.g., knee injury, asthma..."></textarea></label>
            </fieldset>

            <a href = "#">Read our membership terms</a>
            <label for = "check" ><input type="checkbox"
                    required id = "check" name = "cheak?" class = "inline"> I agree to the membership terms and conditions</label>

            <input type="submit" value="Submit">
        </form>
    </body>
</html>
