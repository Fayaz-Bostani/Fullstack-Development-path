<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width = device-width, initial-scale = 1.0">
        <title>order-status-board</title>
        <link rel = "stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Order Status Board</h1>
        </header>
        <div class = "status-container">
            <div class = "status-box status-new">
                <h2>New Order</h2>
                <p>Just recieved</p>
            </div>
            <div class = "status-box status-progress">
                <h2>Waiting</h2>
                <p>Sourcing</p>
            </div>
            <div class = "status-box status-materials">
                <h2>In Progress</h2>
                <p>being forged</p>
            </div>
            <div class = "status-box status-finishing">
                <h2>Finishing</h2>
                <p>Polishing </p>
            </div>
            <div class = "status-box status-ready">
                <h2>Pickup</h2>
                <p>Completed</p>
            </div>
            <div class = "status-box status-delivered">
                <h2>Delivered</h2>
                <p>handed over</p>
            </div>
        </div>
    </body>
</html>
